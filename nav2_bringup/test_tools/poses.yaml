# poses.yaml - 存储多个三维姿态的YAML文件
# 说明：每个pose包含position(xyz)和orientation(xyzw四元数)

poses:
  # 第一个姿态示例（可根据需求修改坐标值）
  pose_0:
    name: "位置1"
    position:
      x: -2.776944160461426
      y: -11.664710998535156
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -0.06895035441108438
      w: 0.9976200923330413

  # 第二个姿态示例（机器人前方1米处）
  pose_1:
    name: "位置2"
    position:
      x: -2.702977180480957
      y: -6.454741477966309
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.6472811738827275
      w: 0.7622513246541447

  # 第三个姿态示例（左前方0.5米处，偏航角90度）
  pose_2:
    name: "位置3"
    position:
      x: -8.300702095031738
      y: -6.955036163330078
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.011255929452867706
      w: 0.999936650019466

  # 可按此格式继续添加pose_n（n从3开始）
  # pose_3:
  #   position:
  #     x: ...
  #     y: ...
  #     z: ...
  #   orientation:
  #     x: ...
  #     y: ...
  #     z: ...
  #     w: ...