controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 预测与采样参数
      time_steps: 56              # 每条轨迹的时间步数，与model_dt共同决定预测 horizon (56*0.05=2.8秒)
      model_dt: 0.05              # 时间步长(s)，建议与控制器频率匹配(1/0.05=20Hz)
      batch_size: 2000            # 每轮采样的候选轨迹数量，越大越能探索更多可能性但计算开销更高
      vx_std: 0.2                 # 线速度采样的高斯噪声标准差，影响探索范围
      vy_std: 0.2                 # 横向速度采样的高斯噪声标准差(适用于全向机器人)
      wz_std: 0.4                 # 角速度采样的高斯噪声标准差

      # 速度约束参数
      vx_max: 0.5                 # 最大线速度(m/s)，需匹配机器人物理极限
      vx_min: -0.35               # 最小线速度(m/s)，负值允许后退
      vy_max: 0.0                 # 最大横向速度(m/s)，适用于全向机器人
      wz_max: 0.25                 # 最大角速度(rad/s)

      # 优化参数
      iteration_count: 1          # MPPI迭代次数，通常设为1并依赖更多批次采样
      prune_distance: 1.7         # 路径修剪距离，保留机器人前方指定距离内的路径点
      transform_tolerance: 0.1    # TF变换的最大容忍时间(s)
      temperature: 0.3            # 控制轨迹选择的"软性"，越小越倾向最优轨迹，过大则接近随机选择
      gamma: 0.015                # 平滑性与能耗的权衡参数，较大值鼓励平滑轨迹

      # 机器人模型与可视化
      motion_model: "DiffDrive"   # 运动模型类型: DiffDrive(差分驱动), Omni(全向), Ackermann(阿克曼)
      visualize: true             # 是否发布轨迹可视化，调试时使用，会显著降低性能
      TrajectoryVisualizer:
        trajectory_step: 5        # 可视化时跳过的轨迹数，降低显示密度
        time_step: 5              # 可视化时轨迹点的步长，降低显示密度

      # 阿克曼模型约束(当前配置用于差分驱动，此参数无效)
      AckermannConstraints:
        min_turning_r: 0.2        # 最小转弯半径(m)，仅用于阿克曼模型

      # 评价函数配置
      critics: [ "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic" ]

      # 约束评价函数 - 确保控制在限制范围内
      ConstraintCritic:
        enabled: true
        cost_power: 1             # 代价幂次，通常为1
        cost_weight: 4.0          # 权重，控制约束的严格程度

      # 目标位置评价函数 - 引导机器人接近目标点
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0          # 权重越高，机器人越优先接近目标
        threshold_to_consider: 1.4 # 距离目标小于此值时开始考虑该评价函数

      # 目标角度评价函数 - 引导机器人朝向目标角度
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0          # 权重越高，机器人越优先调整朝向
        threshold_to_consider: 0.5 # 距离目标小于此值时开始考虑该评价函数

      # 偏好前进评价函数 - 惩罚后退行为
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0          # 权重越高，越倾向于前进
        threshold_to_consider: 0.5 # 距离目标大于此值时生效

      # 代价地图评价函数 - 基于代价地图避障
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81         # 权重越高，越远离高代价区域
        critical_cost: 300.0      # 临界代价，超过此值的区域被视为危险
        consider_footprint: true  # 是否考虑机器人 footprint，计算更精确但开销更大
        collision_cost: 1000000.0 # 碰撞代价，设为极大值避免碰撞
        near_goal_distance: 1.0   # 接近目标时降低避障权重，便于在障碍物附近精确导航
        trajectory_point_step: 2  # 评价轨迹点的步长，降低计算量

      # 路径对齐评价函数 - 引导轨迹与全局路径方向一致
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0         # 权重越高，轨迹越贴近路径方向
        max_path_occupancy_ratio: 0.05 # 路径占用率阈值，超过此值时认为路径被阻挡
        trajectory_point_step: 4  # 评价轨迹点的步长
        threshold_to_consider: 0.5 # 距离目标小于此值时开始考虑该评价函数
        offset_from_furthest: 20  # 从最远路径点向前的偏移量，用于计算对齐角度
        use_path_orientations: false # 是否使用路径点的朝向信息(适用于带方向的路径)

      # 路径跟随评价函数 - 引导机器人跟随全局路径
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0          # 权重越高，轨迹越贴近路径
        offset_from_furthest: 5   # 从最远路径点向前的偏移量，用于计算跟随误差
        threshold_to_consider: 1.4 # 距离目标大于此值时生效

      # 路径角度评价函数 - 引导机器人朝向路径前进方向
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0          # 权重越高，越倾向于与路径方向一致
        offset_from_furthest: 4   # 从最远路径点向前的偏移量
        threshold_to_consider: 0.5 # 距离目标小于此值时开始考虑该评价函数
        max_angle_to_furthest: 1.0 # 最大角度差，超过此值时开始惩罚
        forward_preference: true  # 是否偏好向前运动方向

      # 未启用的评价函数(可根据需要取消注释)
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]  # 速度死区，防止微小振荡
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0  # 惩罚原地旋转行为


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.385, 0.0],[-0.376, -0.134],[-0.331, -0.224],[-0.272, -0.269],[0.281, -0.266],[0.355, -0.203],[0.379, -0.104],[0.385, 0.0],[0.379, 0.125],[0.343, 0.212],[0.293, 0.26],[-0.284, 0.263],[-0.331, 0.221],[-0.367, 0.158]]"
      robot_radius: 0.38
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.8
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.4
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.4
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[-0.385, 0.0],[-0.376, -0.134],[-0.331, -0.224],[-0.272, -0.269],[0.281, -0.266],[0.355, -0.203],[0.379, -0.104],[0.385, 0.0],[0.379, 0.125],[0.343, 0.212],[0.293, 0.26],[-0.284, 0.263],[-0.331, 0.221],[-0.367, 0.158]]"
      robot_radius: 0.38
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.4
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.8
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D" # In Iron and older versions, "/" was used instead of "::"
      tolerance: 0.05                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10


smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.5, 0.0, 3.2]
    max_decel: [-0.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
